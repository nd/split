plugins {
  id 'java'
  id 'org.jetbrains.kotlin.jvm' version '2.3.0'
  id 'org.jetbrains.intellij.platform' version '2.10.5'
}

repositories {
  mavenCentral()
  intellijPlatform {
    defaultRepositories()
  }
}

dependencies {
  intellijPlatform {
    local(providers.gradleProperty('ideaPath'))
  }
}

intellijPlatform {
  buildSearchableOptions = false
  pluginConfiguration {
    ideaVersion {
      sinceBuild = '263.8043'
      untilBuild = provider { null }
    }
  }
}

kotlin {
  jvmToolchain(25)
}
